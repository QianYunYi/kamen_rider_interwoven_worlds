buildscript {
    ext.kotlin_version = '2.0.21'
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0,6.2)', changing: true
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'org.spongepowered:mixingradle:0.7.+'
        classpath 'org.parchmentmc.librarian.forgegradle:org.parchmentmc.librarian.forgegradle.gradle.plugin:1.+'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'kotlin'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'org.parchmentmc.librarian.forgegradle'

base {
    archivesName = 'kamen_rider_interwoven_worlds'
}

version = "${minecraft_version}-${forge_version}-${mod_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

def mainSourceSet = sourceSets.main

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source mainSourceSet
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
    }
}

mixin {
    add sourceSets.main, "mixins.kamen_rider_interwoven_worlds.refmap.json"
    config "mixins.kamen_rider_interwoven_worlds.json"
    disableAnnotationProcessorCheck()
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }

    maven { url = 'https://mirrors.tuna.tsinghua.edu.cn/maven/repos/public' }
    maven { url = 'https://maven.aliyun.com/repository/public' }

    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://maven.kosmx.dev/' }
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://modmaven.dev" }

    maven {
        url "https://www.cursemaven.com"
    }

    maven { url = 'https://jitpack.io' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation 'org.spongepowered:mixin:0.8.5'

    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:0.2.0"))

    implementation fg.deobf("io.github.llamalad7:mixinextras-forge:0.2.0")

    def mixinextrasForge = dependencies.create("io.github.llamalad7:mixinextras-forge:[0.2.0,)")
    jarJar mixinextrasForge

    def geckolibDep = "software.bernie.geckolib:geckolib-forge-${minecraft_version}:4.8.4"
    implementation fg.deobf(geckolibDep)
    jarJar geckolibDep

    def playerAnim = dependencies.create("dev.kosmx.player-anim:player-animation-lib-forge:[1.0,2.0)")
    implementation fg.deobf(playerAnim)
    jarJar playerAnim

    implementation fg.deobf('curse.maven:riderapi-1138346:8020228')
    jarJar('curse.maven:riderapi-1138346:[8020228]')
}

compileJava {
    options.encoding = 'UTF-8'
    options.annotationProcessorPath = configurations.annotationProcessor
    options.compilerArgs += [
            '-Amixin.debug.export=true',
            '-Amixin.refmap.config=mixins.kamen_rider_interwoven_worlds.refmap.json'
    ]
    options.compilerArgs << "-Xlint:-removal"
    options.compilerArgs << "-Xlint:-deprecation"
}

tasks.processResources {
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            forge_version           : forge_version,
            forge_version_range     : forge_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta', 'mixins.kamen_rider_interwoven_worlds.json']) {
        expand replaceProperties + [project: project]
    }
}

tasks.jar {
    manifest {
        attributes(
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : mod_version,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        )
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}